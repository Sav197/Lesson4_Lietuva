function fresh(){return{version:1,lesson:4,xp:0,attempts:0,correct:0,days:{},best:{},qstats:{},srs:{},mistakes:{},dailyGoal:10,reminderTime:'19:00',rate:.85,strict:true,lastModule:1}}
function sanitize(raw){
 if(!raw||raw.lesson!==4||raw.version!==1)throw Error('Це не копія прогресу уроку 4.');
 const o=fresh();for(const k of ['xp','attempts','correct'])o[k]=Math.floor(num(raw[k]));
 o.correct=Math.min(o.correct,o.attempts);o.dailyGoal=[5,10,15,20].includes(raw.dailyGoal)?raw.dailyGoal:10;
 o.reminderTime=/^([01]\d|2[0-3]):[0-5]\d$/.test(raw.reminderTime)?raw.reminderTime:'19:00';o.rate=[.7,.85,1].includes(raw.rate)?raw.rate:.85;o.strict=raw.strict!==false;o.lastModule=Math.floor(num(raw.lastModule,1,8))||1;
 for(const [k,v]of Object.entries(raw.days||{})){if(/^\d{4}-\d{2}-\d{2}$/.test(k)&&v&&typeof v==='object')o.days[k]={attempts:Math.floor(num(v.attempts)),correct:Math.floor(num(v.correct))}}
 for(const [k,v]of Object.entries(raw.best||{})){if(/^[1-8]$|^final$/.test(k))o.best[k]=num(v,0,100)}
 for(const [k,v]of Object.entries(raw.qstats||{})){if(Object.hasOwn(qMap,k)&&v&&typeof v==='object')o.qstats[k]={attempts:Math.floor(num(v.attempts)),correct:Math.floor(num(v.correct)),last:num(v.last,0,9e15)}}
 for(const [k,v]of Object.entries(raw.srs||{})){if(Object.hasOwn(cardMap,k)&&v&&typeof v==='object')o.srs[k]={step:Math.floor(num(v.step,0,5)),due:num(v.due,0,9e15),seen:Math.floor(num(v.seen)),last:num(v.last,0,9e15)}}
 for(const [k,v]of Object.entries(raw.mistakes||{})){if(Object.hasOwn(qMap,k)&&v&&typeof v==='object')o.mistakes[k]={fails:Math.floor(num(v.fails,1,1000))||1,nextAt:num(v.nextAt,0,9e15)}}
 return o;
}

function checkAnswer(){if(!session||session.answered||!canCheck())return;const s=session,item=s.questions[s.index],q=item.q;let answer=q.type==='mc'?s.options[s.choice]:q.type==='text'?s.input:s.selectedTokens.map(id=>s.tokens.find(t=>t.id===id).word).join(' ');let ok=norm(answer)===norm(q.answer);s.near=!ok&&fold(answer)===fold(q.answer);
 if(q.type==='text'&&!state.strict&&s.near)ok=true;
 if(q.type==='build'&&!ok){const groupOK=(q.groups||[]).every(g=>(' '+norm(answer)+' ').includes(' '+norm(g)+' '));const tokensOK=norm(answer).split(' ').sort().join('|')===norm(q.answer).split(' ').sort().join('|');ok=groupOK&&tokensOK}
 s.answered=true;s.lastCorrect=ok;
 if(!item.retry&&ok)s.firstCorrect++;
 const qs=state.qstats[q.id]||{attempts:0,correct:0,last:0};qs.attempts++;if(ok)qs.correct++;qs.last=Date.now();state.qstats[q.id]=qs;
 if(ok){delete state.mistakes[q.id];if(q.card)scheduleCard(q.card,true)}else{state.mistakes[q.id]={fails:(state.mistakes[q.id]?.fails||0)+1,nextAt:Date.now()};if(q.card)scheduleCard(q.card,false);s.wrong.add(q.id);if(s.kind!=='final'&&!item.retry&&!s.retries.has(q.id)){s.questions.push({q,retry:true});s.retries.add(q.id)}}

}

function dialogScreen(){return`<div class="screen-title row"><button class="back" data-action="nav" data-id="train" aria-label="До тренажерів">‹</button><div><div class="eyebrow">Практикуйте живі фрази</div><h1>Читаємо діалоги</h1></div></div>${DATA.dialogs.map((d,i)=>`<div class="card gap"><span class="pill">Діалог ${i+1}</span><h2 class="gap">${d.title}</h2><p class="small muted gap">${d.label}</p>${d.lines.map((line,j)=>`<div class="dialog-line"><div class="spread"><span lang="lt">${e(line[0])}</span><button class="icon-button" data-action="speak-line" data-id="${i},${j}" aria-label="Озвучити репліку">♪</button></div><details><summary style="font-size:11px;min-height:30px;padding:7px">Показати переклад</summary><div class="translation-line">${e(line[1])}</div></details></div>`).join('')}<button class="primary full" data-action="start-dialog" data-id="${i}">Перевірити розуміння</button></div>`).join('')}`}
function startMatch(){const pool=DATA.cards.filter(c=>['Місто','Професії','Люди'].includes(c.cat));const cards=rnd(pool).slice(0,5);match={cards,left:rnd(cards),right:rnd(cards),selectedLeft:null,selectedRight:null,matched:new Set(),tries:0,errors:0,finished:false,startXP:state.xp,wrongIds:[]};view='match';render();window.scrollTo({top:0,behavior:'instant'})}
function matchScreen(){const m=match;if(!m)return trainScreen();if(m.finished)return`<section class="result"><div class="medal">🔗</div><h1>Усі пари знайдено!</h1><div class="score-grid"><div class="score-cell"><strong>5</strong><small>пар</small></div><div class="score-cell"><strong>${m.errors}</strong><small>помилок</small></div><div class="score-cell"><strong>+${state.xp-m.startXP}</strong><small>XP</small></div></div><button class="primary full" data-action="new-match">Ще 5 пар</button><button class="outline full gap" data-action="nav" data-id="train">До тренажерів</button></section>`;return`<div class="quiz-top"><button class="back" data-action="quit" aria-label="Вийти">×</button><div class="progress-line"><span style="width:${m.matched.size/5*100}%"></span></div><span class="quiz-step">${m.matched.size} / 5</span></div><h1 class="question">З’єднайте слово<br>та його переклад</h1><p class="small muted" style="margin-bottom:20px">Спочатку оберіть литовське слово, потім український відповідник.</p><div class="match-board">${['left','right'].map(side=>`<div class="match-col">${m[side].map(c=>`<button class="match-tile ${m.matched.has(c.id)?'matched':''} ${m[side==='left'?'selectedLeft':'selectedRight']===c.id?'selected':''} ${m.wrongIds.includes(side+':'+c.id)?'mismatch':''}" data-action="match-tile" data-side="${side}" data-id="${c.id}" ${m.matched.has(c.id)?'disabled':''} ${side==='left'?'lang="lt"':''}>${e(side==='left'?c.n:c.u)}</button>`).join('')}</div>`).join('')}</div><p class="help-footer">Правильні пари залишаються видимими. Можна змінити вибір до перевірки другої картки.</p>`}
function matchTile(side,id){const m=match;if(!m||m.finished||m.matched.has(id))return;m.wrongIds=[];if(side==='left')m.selectedLeft=id;else m.selectedRight=id;if(m.selectedLeft&&m.selectedRight){m.tries++;const ok=m.selectedLeft===m.selectedRight;if(ok){m.matched.add(m.selectedLeft);scheduleCard(m.selectedLeft,true);touch(true,5)}else{m.errors++;m.wrongIds=['left:'+m.selectedLeft,'right:'+m.selectedRight];scheduleCard(m.selectedLeft,false);touch(false,1)}m.selectedLeft=null;m.selectedRight=null;if(m.matched.size===5)m.finished=true}render()}
function download(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)}
function pad2(n){return String(n).padStart(2,'0')}
function icsLocal(d){return`${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}T${pad2(d.getHours())}${pad2(d.getMinutes())}00`}
function icsUTC(d){return`${d.getUTCFullYear()}${pad2(d.getUTCMonth()+1)}${pad2(d.getUTCDate())}T${pad2(d.getUTCHours())}${pad2(d.getUTCMinutes())}${pad2(d.getUTCSeconds())}Z`}
function icsEscape(s){return s.replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;')}
function foldICS(lines){const enc=new TextEncoder();return lines.flatMap(line=>{let parts=[],cur='';for(const ch of line){if(enc.encode(cur+ch).length>73){parts.push(cur);cur=' '+ch}else cur+=ch}parts.push(cur);return parts}).join('\r\n')+'\r\n'}
function calendarText(plan=false,now=new Date()){let base=new Date(now);const [h,m]=state.reminderTime.split(':').map(Number);base.setHours(h,m,0,0);if(base<=now)base.setDate(base.getDate()+1);const stamp=icsUTC(now),uid=`${now.getTime()}-${Math.random().toString(36).slice(2,9)}`;let lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Labas//Lithuanian Lesson 4//UK','CALSCALE:GREGORIAN','METHOD:PUBLISH'];const offsets=plan?[1,3,7,14]:[0];for(const offset of offsets){let d=new Date(base);if(plan){d=new Date(now);d.setDate(d.getDate()+offset);d.setHours(h,m,0,0)}const end=new Date(d.getTime()+10*60000);lines.push('BEGIN:VEVENT',`UID:${uid}-${offset}@labas-lesson4.local`,`DTSTAMP:${stamp}`,`DTSTART:${icsLocal(d)}`,`DTEND:${icsLocal(end)}`,'SUMMARY:'+icsEscape(plan?`Литовська · Урок 4 · повторення через ${offset} дн.`:'Литовська · Урок 4 · 10 хвилин практики'),'DESCRIPTION:'+icsEscape('Відкрийте свій index.html уроку 4. Повторіть картки\nта виконайте коротку серію вправ з į, pas, prie.'));if(!plan)lines.push('RRULE:FREQ=DAILY');lines.push('BEGIN:VALARM','TRIGGER:-PT5M','ACTION:DISPLAY','DESCRIPTION:'+icsEscape('Час повторити литовську · Урок 4'),'END:VALARM','END:VEVENT')}lines.push('END:VCALENDAR');return foldICS(lines)}
function exportProgress(){download('labas-lesson4-progress.json',JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2),'application/json;charset=utf-8');toast('Копію прогресу підготовлено. Збережіть завантажений файл.')}
async function importProgress(file){if(!file)return;if(file.size>3000000){toast('Файл завеликий для копії прогресу.');return}try{const text=await file.text(),candidate=sanitize(JSON.parse(text));showModal('Відновити прогрес?','Поточний прогрес уроку 4 буде замінено даними цієї копії. Інші уроки не змінюються.','Відновити',()=>{state=candidate;save();view='profile';render();toast('Прогрес уроку 4 відновлено.')})}catch(err){toast('Не вдалося прочитати копію: '+err.message)}}
let pendingModalAction=null;
function showModal(title,text,label,callback){pendingModalAction=callback;$('modal').className='quit-layer';$('modal').innerHTML=`<div class="quit-box" role="dialog" aria-modal="true" aria-labelledby="modal-title"><h2 id="modal-title">${e(title)}</h2><p>${e(text)}</p><button id="modal-confirm" class="primary full" data-action="modal-confirm">${e(label)}</button><button class="outline full gap" data-action="modal-cancel">Скасувати</button></div>`;setTimeout(()=>$('modal-confirm')?.focus(),0)}
function closeModal(){ $('modal').className='hide';$('modal').innerHTML='';pendingModalAction=null}
function askQuit(callback=()=>go('train',true)){showModal('Завершити тренування?','Уже нараховані бали й відповіді збережено. Підсумок цієї серії не буде зараховано.','Вийти',callback)}
document.addEventListener('click',event=>{const b=event.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,id=b.dataset.id;
 switch(a){
 case'nav':if(id==='cards'&&flashIndex>=flashDeck.length)beginCards();go(id);break;
 case'open-module':currentModule=Number(id);moduleTab='learn';go('module');break;
 case'module-tab':moduleTab=id;render();break;
 case'start':start(id);break;
 case'training':if(id==='match')startMatch();else if(['forms','route','dialog'].includes(id)){lastRouteKind='';go(id)}else start(id);break;
 case'speak-card':speak(cardMap[id].n);break;
 case'flip':flashFlipped=!flashFlipped;render();break;
 case'card-mode':dictMode=id==='dict';render();break;
 case'card-cat':flashCat=id;beginCards();render();break;
 case'reverse':flashReverse=!flashReverse;flashFlipped=false;render();break;
 case'reshuffle':beginCards();render();break;
 case'rate-card':rateCard(id==='1');break;
 case'skip-card':flashIndex++;flashFlipped=false;render();break;
 case'choice':if(session&&!session.answered){session.choice=Number(id);render()}break;
 case'check':checkAnswer();break;
 case'next':nextQuestion();break;
 case'letter':{const input=$('answer-input');if(!input||session?.answered)break;const start=input.selectionStart??input.value.length,end=input.selectionEnd??start;input.value=input.value.slice(0,start)+id+input.value.slice(end);session.input=input.value;input.focus();input.setSelectionRange(start+id.length,start+id.length);$('check-answer').disabled=!canCheck();break}
 case'token':if(session&&!session.answered&&!session.selectedTokens.includes(Number(id))){session.selectedTokens.push(Number(id));render()}break;
 case'remove-token':if(session&&!session.answered){session.selectedTokens.splice(Number(id),1);render()}break;
 case'speak-answer':speak(session.questions[session.index].q.speak);break;
 case'quit':askQuit();break;
 case'restart':{const kind=session.kind,mid=session.moduleId,reading=session.questions[0].q.reading;if(mid)currentModule=mid;start(kind,reading);break}
 case'result-next':if(session?.moduleId&&session.moduleId<8){currentModule=session.moduleId+1;moduleTab='learn';go('module',true)}else go('home',true);break;
 case'due-flash':flashDeck=rnd(dueCards());flashCat='Усі';flashIndex=0;flashFlipped=false;flashRated=0;dictMode=false;view='cards';render();break;
 case'calendar':case'calendar-week':download(a==='calendar'?'lithuanian-lesson4-daily.ics':'lithuanian-lesson4-review.ics',calendarText(a==='calendar-week'),'text/calendar;charset=utf-8');toast('Відкрийте .ics у календарі та підтвердьте імпорт.');break;
 case'export':exportProgress();break;
 case'import':$('file-import').value='';$('file-import').click();break;
 case'voice-test':speak('Kaip sekasi? Gerai, ačiū.');break;
 case'reset':showModal('Скинути урок 4?','Це видалить бали, результати, картки та список помилок лише цього уроку. Збережіть резервну копію, якщо хочете повернутися до прогресу.','Скинути прогрес',()=>{state=fresh();flashDeck=[];save();go('home',true);toast('Прогрес уроку 4 скинуто.')});break;
 case'modal-cancel':closeModal();break;
 case'modal-confirm':{const cb=pendingModalAction;closeModal();if(cb)cb();break}
 case'forms-quiz':start('formsquiz');break;
 case'speak-forms':{const c=cardMap[$('form-word').value];speak([c.n,c.a,c.g,c.l].join('. '));break}
 case'speak-route':speak($('route-result').dataset.speech);break;
 case'dialog':go('dialog');setTimeout(()=>document.querySelectorAll('#main>.card')[Number(id)]?.scrollIntoView({block:'start',behavior:'smooth'}),0);break;
 case'start-dialog':start('dialog',Number(id));break;
 case'speak-line':{const[i,j]=id.split(',').map(Number);speak(DATA.dialogs[i].lines[j][0]);break}
 case'new-match':startMatch();break;
 case'match-tile':matchTile(b.dataset.side,id);break;
 }
});
document.addEventListener('input',event=>{const el=event.target;if(el.id==='answer-input'&&session){session.input=el.value;const btn=$('check-answer');if(btn)btn.disabled=!canCheck()}if(el.id==='dict-search'){searchText=el.value;const q=fold(searchText);const list=DATA.cards.filter(c=>(flashCat==='Усі'||c.cat===flashCat)&&(!q||fold(c.n+' '+c.u).includes(q)));$('dict-results').innerHTML=dictionary(list);$('dict-count').textContent=list.length+' слів / фраз'}});
document.addEventListener('change',event=>{const el=event.target;switch(el.id){case'daily-goal':state.dailyGoal=Number(el.value);save();break;case'reminder-time':if(/^([01]\d|2[0-3]):[0-5]\d$/.test(el.value)){state.reminderTime=el.value;save()}break;case'voice-rate':state.rate=Number(el.value);save();break;case'strict-mode':state.strict=el.checked;save();break;case'file-import':importProgress(el.files[0]);break;case'form-word':updateForms();break;case'route-kind':case'route-word':updateRoute();break}});
document.addEventListener('keydown',event=>{if(!$('modal').classList.contains('hide')){if(event.key==='Escape')closeModal();if(event.key==='Tab'){const bs=$('modal').querySelectorAll('button');if(event.shiftKey&&document.activeElement===bs[0]){event.preventDefault();bs[bs.length-1].focus()}else if(!event.shiftKey&&document.activeElement===bs[bs.length-1]){event.preventDefault();bs[0].focus()}}return}if(view!=='quiz'||!session)return;const q=session.questions[session.index].q;if(event.key==='Enter'){if(session.answered)nextQuestion();else checkAnswer();event.preventDefault()}else if(q.type==='mc'&&!session.answered&&['1','2','3','4'].includes(event.key)){const i=Number(event.key)-1;if(i<session.options.length){session.choice=i;render()}}});
if(window.speechSynthesis){window.speechSynthesis.addEventListener?.('voiceschanged',()=>{if(view==='profile'){const v=availableVoices();if($('voice-status'))$('voice-status').textContent=v.length?'Знайдено литовський голос: '+v[0].name:'Литовського голосу не знайдено. Додайте його в налаштуваннях пристрою.'}});window.speechSynthesis.getVoices()}
window.addEventListener('pageshow',()=>{updateHeader()});
render();
</script>
</body>
